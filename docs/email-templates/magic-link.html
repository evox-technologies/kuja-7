<!--
  Supabase → Authentication → Email Templates → "Magic Link"
  Subject: Your Kuja7 login code
  Keeps OTP code-based sign-in consistent with signup. MUST keep {{ .Token }}.
-->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 0;font-family:Arial,Helvetica,sans-serif">
  <tr><td align="center">
    <table width="440" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden">
      <tr><td style="background:#E53856;padding:24px 32px">
        <span style="color:#ffffff;font-size:20px;font-weight:bold;letter-spacing:3px">KUJA7</span>
      </td></tr>
      <tr><td style="padding:32px">
        <h1 style="margin:0 0 8px;font-size:22px;color:#18181b">Your login code</h1>
        <p style="margin:0 0 24px;font-size:14px;color:#71717a">Enter this 6-digit code to sign in.</p>
        <div style="background:#FFF0F3;border-radius:12px;padding:20px;text-align:center;margin-bottom:24px">
          <span style="font-size:34px;font-weight:bold;letter-spacing:10px;color:#E53856">{{ .Token }}</span>
        </div>
        <p style="margin:0;font-size:12px;color:#a1a1aa">This code expires in 1 hour. If you didn't request it, ignore this email.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
