<!--
  Supabase → Authentication → Email Templates → "Confirm signup"
  Subject: Your Kuja7 verification code
  Used by the register OTP step (signInWithOtp). MUST keep {{ .Token }}.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 16px;font-family:Nunito,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <tr><td align="center">
    <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="width:100%;max-width:440px;background:#ffffff;border-radius:16px;overflow:hidden">

      <tr><td style="padding:24px 32px;border-bottom:3px solid #f5b800">
        <span style="font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-size:24px;font-weight:800;letter-spacing:-0.5px;color:#1a1a1a">Kuja<span style="color:#d4970a">7</span><span style="font-weight:400;color:#7a7a7a">.lk</span></span>
      </td></tr>

      <tr><td style="padding:32px">
        <h1 style="margin:0 0 8px;font-size:22px;font-weight:800;color:#18181b">Verify your email</h1>
        <p style="margin:0 0 24px;font-size:14px;line-height:20px;color:#71717a">Enter this 6-digit code to finish creating your account.</p>

        <div style="background:#fffbea;border:1px solid #fce588;border-radius:12px;padding:20px;text-align:center;margin:0 0 24px">
          <span style="font-size:34px;font-weight:800;letter-spacing:8px;text-indent:8px;color:#6b4500">{{ .Token }}</span>
        </div>

        <p style="margin:0;font-size:12px;line-height:18px;color:#a1a1aa">This code expires in 1 hour. If you didn't sign up, you can ignore this email.</p>
      </td></tr>

      <tr><td style="padding:0 32px 24px">
        <p style="margin:0;font-size:11px;color:#c4c4c8">kuja7.lk</p>
      </td></tr>

    </table>
  </td></tr>
</table>
