<!--
  Supabase → Authentication → Email Templates → "Reset Password"
  Subject: Reset your Kuja7 password
  Link flow consumed by /reset-password. MUST keep {{ .ConfirmationURL }}.
  Note: PKCE link must be opened in the same browser that requested it.
-->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 0;font-family:Arial,Helvetica,sans-serif">
  <tr><td align="center">
    <table width="440" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden">
      <tr><td style="background:#E53856;padding:24px 32px">
        <span style="color:#ffffff;font-size:20px;font-weight:bold;letter-spacing:3px">KUJA7</span>
      </td></tr>
      <tr><td style="padding:32px">
        <h1 style="margin:0 0 8px;font-size:22px;color:#18181b">Reset your password</h1>
        <p style="margin:0 0 24px;font-size:14px;color:#71717a">Click the button below to choose a new password. Open it in the same browser you requested it from.</p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#E53856;color:#ffffff;font-size:15px;font-weight:bold;text-decoration:none;padding:14px 28px;border-radius:999px">Reset Password</a>
        <p style="margin:24px 0 0;font-size:12px;color:#a1a1aa">This link expires in 1 hour. If you didn't request a reset, ignore this email — your password won't change.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
