server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js static export with trailingSlash: true
    # /login/ → /login/index.html, fallback to index.html for unknown routes
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Long-cache immutable static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/javascript text/javascript;
}
