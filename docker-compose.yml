# Traefik-routed setup — web on kuja7.apps.evoxtechnologies.com, API on kuja7.api.evoxtechnologies.com
# Requires Traefik to be running: cd deploy/traefik && docker compose up -d

services:
  kuja7-web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_BASE_PATH: ""
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kuja7-web.rule=Host(`${WEB_DOMAIN}`)"
      - "traefik.http.routers.kuja7-web.entrypoints=websecure"
      - "traefik.http.routers.kuja7-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.kuja7-web.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  kuja7-api:
    build:
      context: apps/api
    env_file: apps/api/.env.production
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kuja7-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.kuja7-api.entrypoints=websecure"
      - "traefik.http.routers.kuja7-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.kuja7-api.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  traefik-public:
    external: true
