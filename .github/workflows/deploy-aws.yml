name: Deploy — Kuja7 (customer AWS)

# Builds both images on GitHub's runners and pushes them to GHCR; the EC2 box only
# pulls and restarts. That is what lets the instance be a t3.micro — a 1 GB box
# cannot run `next build` and `nest build`, but it can run the results all day.
#
# Secrets live in the `customer-aws` GitHub Environment, not at repo level, so this
# target's domains do not collide with deploy.yml's droplet.

on:
-  # Manual only. deploy.yml ships the droplet on every push to main; the customer's
-  # box ships when someone decides it ships — a merge is not that decision.
   workflow_dispatch:
 
-concurrency:
-  # Deliberately NOT the `deploy` group deploy.yml uses — sharing one would let a
-  # droplet deploy cancel a run halfway through restarting the customer's box.
-  group: deploy-aws
-  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: customer-aws
    permissions:
      contents: read
      packages: write
    concurrency:
      # Deliberately NOT the `deploy` group deploy.yml uses — sharing one would let a
      # droplet deploy cancel a run halfway through restarting the customer's box.
      # Superseding a build is free: only the newest commit is worth an image.
      group: deploy-aws-build
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* are compiled into the JS bundle here, not read at runtime.
      # Changing a domain therefore needs a new run of this workflow, not a restart.
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
            ghcr.io/${{ github.repository }}-web:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: customer-aws
    permissions:
      contents: read
      packages: read
    # Separate group from the build, and never cancelled: two merges in quick
    # succession must not kill an SSH session midway through `docker compose up`
    # and leave the box half-restarted. The second run waits its turn instead.
    concurrency:
      group: deploy-aws-deploy
      cancel-in-progress: false

    steps:
      - name: Pull images and restart on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_DOMAIN: ${{ secrets.WEB_DOMAIN }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,WEB_DOMAIN,API_DOMAIN,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_WS_URL,DATABASE_URL,DIRECT_URL,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,FRONTEND_URL
          script: |
            set -e
            cd /opt/apps/kuja-seven

            # Only for docker-compose.yml itself — nothing is built from this checkout.
            git pull origin main

            # Pinned to this commit's images, so a rollback is: put an older SHA in
            # IMAGE_TAG and `docker compose up -d`. No rebuild.
            cat > .env << EOF
            IMAGE_TAG=${IMAGE_TAG}
            WEB_DOMAIN=${WEB_DOMAIN}
            API_DOMAIN=${API_DOMAIN}
            NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
            NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
            NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
            EOF

            cat > apps/api/.env.production << EOF
            DATABASE_URL=${DATABASE_URL}
            DIRECT_URL=${DIRECT_URL}
            SUPABASE_URL=${SUPABASE_URL}
            SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
            PORT=3001
            FRONTEND_URL=${FRONTEND_URL}
            EOF
            chmod 600 apps/api/.env.production

            # Caddy owns :80/:443 from /opt/infra/caddy and holds the certs. Fail loudly
            # rather than start a rival proxy or run with no route in.
            docker network inspect traefik-public >/dev/null 2>&1 || {
              echo "traefik-public network missing — run: docker network create traefik-public" >&2
              exit 1
            }

            # GITHUB_TOKEN expires with this job, so the customer's box is never left
            # holding a long-lived registry credential.
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io

            # Keep 3 days of old images for rollback; never touches anything in use.
            docker image prune -af --filter "until=72h"
            docker compose ps
