name: Staff access (break-glass)

# Creates staff accounts and changes roles from outside the application.
#
# The portal manages staff itself via POST/PATCH /moderators, with permission
# checks and an audit row — prefer it. This exists because it cannot mint the
# first SUPER_ADMIN: assertMayGrant requires one to already exist, and a fresh
# database has none. It is also the way back in if the last one is locked out.
#
# Deliberate trade-off: these changes write no admin_audit_logs row. The run
# record — who dispatched it, when, with which inputs — is the trail instead,
# and unlike a database row it cannot be edited by whoever just gained admin.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "create a new staff account, or change an existing profile's role"
        required: true
        type: choice
        default: set-role
        options:
          - set-role
          - create
      email:
        description: "Email address"
        required: true
        type: string
      role:
        description: "Role to grant. USER revokes all staff access (set-role only)."
        required: true
        type: choice
        default: MODERATOR
        options:
          - USER
          - MODERATOR
          - ADMIN
          - SUPER_ADMIN
      first_name:
        description: "create only — first name"
        required: false
        type: string
      last_name:
        description: "create only — last name"
        required: false
        type: string
      gender:
        description: "create only — required by the schema, not used by the portal"
        required: false
        type: choice
        default: MALE
        options:
          - MALE
          - FEMALE
      date_of_birth:
        description: "create only — YYYY-MM-DD, required by the schema"
        required: false
        type: string
        default: "1990-01-01"

concurrency:
  # Queued, never cancelled: a cancelled run leaves you unsure whether the write
  # landed, and this is the tool you reach for when you are already locked out.
  group: staff-access
  cancel-in-progress: false

jobs:
  staff:
    runs-on: ubuntu-latest
    environment: customer-aws

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml

      # postinstall runs `prisma generate`, so the client is ready after this.
      - name: Install
        working-directory: apps/api
        run: pnpm install --frozen-lockfile

      - name: Run
        working-directory: apps/api
        env:
          # Prisma reads both; DIRECT_URL is the one it uses for schema-level work.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          # vars, not secrets. Neither value is one: SUPABASE_URL is the same
          # string as NEXT_PUBLIC_SUPABASE_URL, compiled into the JS bundle and
          # served to every visitor, and FRONTEND_URL is the public site. Held as
          # secrets they were redacted from the recovery link this job prints,
          # leaving a URL with *** where the host should be.
          #
          # Define both under Settings → Environments → customer-aws → Variables.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACTION: ${{ inputs.action }}
          EMAIL: ${{ inputs.email }}
          ROLE: ${{ inputs.role }}
          FIRST_NAME: ${{ inputs.first_name }}
          LAST_NAME: ${{ inputs.last_name }}
          GENDER: ${{ inputs.gender }}
          DOB: ${{ inputs.date_of_birth }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # Arguments are passed positionally from env, never interpolated into the
          # command line by the templating engine — an email is free text.
          if [ "$ACTION" = "create" ]; then
            pnpm exec ts-node scripts/staff.ts create \
              "$EMAIL" "$ROLE" "$FIRST_NAME" "$LAST_NAME" "$GENDER" "$DOB" | tee /tmp/out
          else
            pnpm exec ts-node scripts/staff.ts set-role "$EMAIL" "$ROLE" | tee /tmp/out
          fi

          {
            echo "### Staff access"
            echo ""
            echo '```'
            cat /tmp/out
            echo '```'
            echo ""
            echo "Dispatched by @$ACTOR."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Current staff
        if: always()
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          node -e "
            const { PrismaClient } = require('@prisma/client');
            new PrismaClient().profile
              .findMany({ where: { role: { not: 'USER' } }, select: { email: true, role: true }, orderBy: { role: 'asc' } })
              .then(r => console.table(r))
              .finally(() => process.exit(0));
          "
