name: Deploy — Kuja7

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEB_DOMAIN: ${{ secrets.WEB_DOMAIN }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: WEB_DOMAIN,API_DOMAIN,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_WS_URL,DATABASE_URL,DIRECT_URL,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,FRONTEND_URL
          script: |
            set -e
            cd /opt/apps/kuja-seven

            git pull origin main

            # Regenerate .env from CI secrets (overwrites previous)
            cat > .env << EOF
            WEB_DOMAIN=${WEB_DOMAIN}
            API_DOMAIN=${API_DOMAIN}
            NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
            NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
            NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
            EOF

            # Regenerate apps/api/.env.production from CI secrets (overwrites previous)
            cat > apps/api/.env.production << EOF
            DATABASE_URL=${DATABASE_URL}
            DIRECT_URL=${DIRECT_URL}
            SUPABASE_URL=${SUPABASE_URL}
            SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
            PORT=3001
            FRONTEND_URL=${FRONTEND_URL}
            EOF

            # Traefik is shared infrastructure and runs from /opt/infra/traefik (the
            # evox-technologies/evox-infra repo) — an app deploy must not restart the
            # proxy that serves every other app on the box. Fail loudly if it is gone
            # rather than start a rival one fighting for :80.
            docker network inspect traefik-public >/dev/null 2>&1 || {
              echo "traefik-public network missing — bring Traefik up from /opt/infra/traefik first" >&2
              exit 1
            }

            docker compose up --build -d --remove-orphans
            docker compose ps
